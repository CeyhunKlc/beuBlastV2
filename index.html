  :root:not([data-theme="light"]) { }
  :root[data-theme="light"]{
    --bg:#f4f2fb; --panel:#ffffff; --panel-2:#efecfa; --grid-empty:#e6e2f7;
    --text:#231f3d; --muted:#726b99; --accent:#e0a500; --line:#d8d3ef;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%; overscroll-behavior:none;}
  .bg-logo{
    position:fixed; inset:0; z-index:0; pointer-events:none;
    background-image:var(--logo-img);
    background-repeat:no-repeat; background-position:center 38%;
    background-size:min(140vw,900px);
    opacity:.10; filter:saturate(1.1);
  }
  .wrap{ position:relative; z-index:1; }
  .corner-logo{
    position:fixed; top:calc(10px + env(safe-area-inset-top,0px));
    width:44px; height:44px; z-index:2; pointer-events:none;
    background-image:var(--logo-img); background-size:contain;
    background-repeat:no-repeat; background-position:center;
    filter:drop-shadow(0 2px 4px rgba(0,0,0,.35));
  }
  .corner-logo.left{ left:12px; }
  .corner-logo.right{ right:12px; }
  @media (min-width:480px){
    .corner-logo{ width:56px; height:56px; }
  }
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:'Nunito',sans-serif;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
    display:flex; flex-direction:column; align-items:center;
    min-height:100%; overflow-x:hidden;
    touch-action:manipulation;
    -webkit-touch-callout:none;
    -webkit-user-select:none; user-select:none;
  }
  .wrap{ width:100%; max-width:480px; padding:14px 16px 24px; display:flex; flex-direction:column; align-items:center; }
  h1{
    font-family:'Baloo 2',sans-serif; font-weight:800; font-size:clamp(28px,7vw,36px);
    margin:2px 0 2px; letter-spacing:.5px; color:var(--text);
  }
  .sub{ color:var(--muted); font-size:14px; margin-bottom:14px; text-align:center; }
  .scorebar{
    width:100%; display:flex; justify-content:space-between; align-items:center;
    background:var(--panel); border-radius:16px; padding:10px 18px; margin-bottom:14px;
  }
  .score-block{ text-align:center; }
  .score-label{ font-size:11px; color:var(--muted); font-weight:700; }
  .score-val{ font-family:'Baloo 2',sans-serif; font-size:26px; font-weight:700; color:var(--accent); }
  .score-val.low-time{ color:var(--c1); }
  #board{
    display:grid; grid-template-columns:repeat(8,1fr); gap:4px;
    background:var(--panel-2); padding:7px; border-radius:14px;
    width:min(94vw,400px); aspect-ratio:1/1; margin-bottom:14px;
    box-shadow:0 8px 24px rgba(0,0,0,.25);
    touch-action:manipulation;
  }
  .cell{ border-radius:6px; background:var(--grid-empty); transition:background .1s; touch-action:manipulation; }
  .cell.filled{ box-shadow:inset 0 -3px 0 rgba(0,0,0,.18), inset 0 2px 0 rgba(255,255,255,.25); }
  .cell.preview-ok{ outline:2px solid var(--c3); outline-offset:-2px; }
  .cell.preview-bad{ outline:2px solid var(--c1); outline-offset:-2px; }
  .cell:active{ filter:brightness(1.15); }
  .hint{ font-size:13px; color:var(--muted); margin-bottom:10px; min-height:18px; text-align:center; }
  #tray{
    display:flex; gap:10px; width:100%; justify-content:center;
    position:sticky; bottom:calc(10px + env(safe-area-inset-bottom,0px));
    padding-bottom:4px;
  }
  .piece-slot{
    background:var(--panel); border-radius:14px; padding:8px;
    display:grid; place-items:center; flex:1; max-width:112px; aspect-ratio:1/1;
    border:2px solid transparent; cursor:pointer; transition:.15s;
    touch-action:manipulation;
  }
  .piece-slot:active{ transform:scale(.95); }
  .piece-slot.selected{ border-color:var(--accent); background:var(--panel-2); transform:translateY(-4px); box-shadow:0 6px 14px rgba(0,0,0,.25); }
  .piece-slot.used{ visibility:hidden; }
  .piece-slot{ touch-action:none; cursor:grab; }
  .piece-slot.dragging{ opacity:.3; }
  .ghost{ position:fixed; left:0; top:0; display:grid; pointer-events:none; z-index:10;
    opacity:.93; filter:drop-shadow(0 8px 10px rgba(0,0,0,.45)); will-change:transform; }
  .ghost div{ border-radius:6px; }
  .ghost div.on{ box-shadow:inset 0 -3px 0 rgba(0,0,0,.18), inset 0 2px 0 rgba(255,255,255,.25); }
  .cell.preview-ok{ filter:brightness(1.6); }
  .piece-grid{ display:grid; gap:2px; }
  .piece-cell{ width:16px; height:16px; border-radius:3px; background:transparent; }
  .piece-cell.on{ box-shadow:inset 0 -2px 0 rgba(0,0,0,.18), inset 0 1px 0 rgba(255,255,255,.25); }
  .footer{ margin-top:16px; display:flex; flex-direction:column; align-items:center; gap:8px; }
  #newgame{
    font-family:'Nunito',sans-serif; font-weight:700; font-size:14px; color:var(--text);
    background:var(--panel); border:1px solid var(--line); padding:9px 18px; border-radius:999px;
    cursor:pointer;
  }
  #newgame:active{ transform:scale(.97); }
  .qr-toggle{ font-size:13px; color:var(--muted); text-decoration:underline; cursor:pointer; background:none; border:none; font-family:inherit; }
  #qrbox{ display:none; background:var(--panel); border-radius:14px; padding:14px; margin-top:6px; text-align:center; }
  #qrbox.open{ display:block; }
  #qrbox p{ font-size:12px; color:var(--muted); margin:8px 0 0; max-width:220px; }
  #qrcanvas{ background:#fff; padding:8px; border-radius:10px; }
  .overlay{
    position:fixed; inset:0; background:rgba(10,8,20,.72); display:none;
    align-items:center; justify-content:center; z-index:5; padding:20px;
  }
  .overlay.show{ display:flex; }
  .modal{
    background:var(--panel); border-radius:18px; padding:26px 22px; text-align:center; max-width:300px;
  }
  .modal h2{ font-family:'Baloo 2',sans-serif; margin:0 0 6px; font-size:24px; }
  .modal p{ color:var(--muted); margin:0 0 16px; font-size:14px; }
  .modal button{
    font-family:'Nunito',sans-serif; font-weight:700; background:var(--accent); color:#241d00;
    border:none; padding:10px 22px; border-radius:999px; font-size:15px; cursor:pointer;
  }
  a, a:visited{ color:inherit; }
  :focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
</style>
</head>
<body>
<div class="bg-logo" aria-hidden="true"></div>
<div class="corner-logo left" aria-hidden="true"></div>
<div class="corner-logo right" aria-hidden="true"></div>
<div class="wrap">
  <h1>BEU Blast</h1>
  <div class="sub">60 saniyede en yüksek skoru yap!</div>

  <div class="scorebar">
    <div class="score-block">
      <div class="score-label">SKOR</div>
      <div class="score-val" id="score">0</div>
    </div>
    <div class="score-block">
      <div class="score-label">EN İYİ</div>
      <div class="score-val" id="best">0</div>
    </div>
    <div class="score-block">
      <div class="score-label">SÜRE</div>
      <div class="score-val" id="timer">60</div>
    </div>
  </div>

  <div class="hint" id="hint">Parçayı sürükleyip tahtaya bırak</div>
  <div id="board"></div>
  <div id="tray"></div>

  <div class="footer">
    <button id="newgame">Yeni Oyun</button>
    <button class="qr-toggle" id="qrToggle">Bu oyunu QR kod ile paylaş</button>
    <div id="qrbox">
      <div id="qrcanvas"></div>
      <p>Bu linki telefonla tara, herkes aynı adresten oynayabilir.</p>
    </div>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="modal">
    <h2>Oyun Bitti</h2>
    <p id="finalReason" style="margin-bottom:2px;">Süre doldu!</p>
    <p id="finalScoreText">Skor: 0</p>
    <button id="restartBtn">Tekrar Oyna</button>
  </div>
</div>

<script>
(function(){

  function randomPiece(){
    const shape = normalize(SHAPES[Math.floor(Math.random()*SHAPES.length)]);
    const color = COLORS[Math.floor(Math.random()*COLORS.length)];
    return { shape, color };
  }

  function newTray(){
    return [randomPiece(), randomPiece(), randomPiece()];
  }

  function initGame(){
    grid = Array.from({length:SIZE},()=>Array(SIZE).fill(null));
    score = 0; gameOver = false; selected = null;
    tray = newTray();
    best = loadBest();
    bestEl.textContent = best;
    timeLeft = ROUND_SECONDS;
    timerEl.textContent = timeLeft;
    timerEl.classList.remove('low-time');
    renderAll();
    overlay.classList.remove('show');
    if(timerId) clearInterval(timerId);
    timerId = setInterval(tickTimer, 1000);
  }

  function tickTimer(){
    if(gameOver) return;
    timeLeft--;
    timerEl.textContent = Math.max(0,timeLeft);
    if(timeLeft<=10) timerEl.classList.add('low-time');
    if(timeLeft<=0){
      endGame('Süre doldu!');
    }
  }

  function renderBoard(){
    boardEl.innerHTML = '';
    for(let r=0;r<SIZE;r++){
      for(let c=0;c<SIZE;c++){
        const cell = document.createElement('div');
        cell.className = 'cell' + (grid[r][c] ? ' filled' : '');
        if(grid[r][c]) cell.style.background = `var(--${grid[r][c]})`;
        cell.dataset.r = r; cell.dataset.c = c;
        boardEl.appendChild(cell);
      }
    }
  }

  function renderTray(){
    trayEl.innerHTML = '';
    tray.forEach((piece, idx)=>{
      const slot = document.createElement('div');
      slot.className = 'piece-slot' + (piece===null ? ' used' : '') + (selected===idx ? ' selected' : '');
      if(piece){
        const maxR = Math.max(...piece.shape.map(c=>c[0]))+1;
        const maxC = Math.max(...piece.shape.map(c=>c[1]))+1;
        const pg = document.createElement('div');
        pg.className = 'piece-grid';
        pg.style.gridTemplateColumns = `repeat(${maxC}, 14px)`;
        pg.style.gridTemplateRows = `repeat(${maxR}, 14px)`;
        for(let r=0;r<maxR;r++){
          for(let c=0;c<maxC;c++){
            const pc = document.createElement('div');
            const on = piece.shape.some(s=>s[0]===r && s[1]===c);
            pc.className = 'piece-cell' + (on ? ' on' : '');
            if(on) pc.style.background = `var(--${piece.color})`;
            pg.appendChild(pc);
          }
        }
        slot.appendChild(pg);
        slot.addEventListener('pointerdown', e=>startDrag(e, idx));
      }
      trayEl.appendChild(slot);
    });
  }

  function renderAll(){
    renderBoard();
    renderTray();
    scoreEl.textContent = score;
  }

  let drag = null;

  function clearPreview(){
    boardEl.querySelectorAll('.preview-ok').forEach(el=>el.classList.remove('preview-ok'));
  }

  function startDrag(e, idx){
    if(gameOver || drag || !tray[idx]) return;
    e.preventDefault();
    const piece = tray[idx];
    const a = boardEl.children[0].getBoundingClientRect();
    const b = boardEl.children[1].getBoundingClientRect();
    const cell = a.width, pitch = b.left - a.left, gap = pitch - cell;
    const maxR = Math.max(...piece.shape.map(x=>x[0]))+1;
    const maxC = Math.max(...piece.shape.map(x=>x[1]))+1;
    const ghost = document.createElement('div');
    ghost.className = 'ghost';
    ghost.style.gridTemplateColumns = `repeat(${maxC}, ${cell}px)`;
    ghost.style.gridTemplateRows = `repeat(${maxR}, ${cell}px)`;
    ghost.style.gap = gap + 'px';
    for(let r=0;r<maxR;r++){
      for(let c=0;c<maxC;c++){
        const d = document.createElement('div');
        if(piece.shape.some(s=>s[0]===r && s[1]===c)){
          d.className = 'on';
          d.style.background = `var(--${piece.color})`;
        }
        ghost.appendChild(d);
      }
    }
    document.body.appendChild(ghost);
    drag = {
      idx, piece, ghost, pitch, r:null, c:null,
      w: maxC*pitch - gap, h: maxR*pitch - gap,
      lift: e.pointerType === 'mouse' ? 0 : 80,
      slot: e.currentTarget
    };
    drag.slot.classList.add('dragging');
    buzz(8);
    moveDrag(e);
  }

  function moveDrag(e){
    if(!drag) return;
    const gx = e.clientX - drag.w/2;
    const gy = e.clientY - drag.h/2 - drag.lift;
    drag.ghost.style.transform = `translate(${gx}px, ${gy}px)`;
    const a = boardEl.children[0].getBoundingClientRect();
    const c = Math.round((gx - a.left) / drag.pitch);
    const r = Math.round((gy - a.top) / drag.pitch);
    clearPreview();
    if(canPlace(drag.piece.shape, r, c)){
      drag.r = r; drag.c = c;
      drag.piece.shape.forEach(([dr,dc])=>{
        boardEl.children[(r+dr)*SIZE + (c+dc)].classList.add('preview-ok');
      });
    } else {
      drag.r = null; drag.c = null;
    }
  }

  function endDrag(cancelled){
    if(!drag) return;
    const d = drag; drag = null;
    clearPreview();
    d.ghost.remove();
    d.slot.classList.remove('dragging');
    if(!cancelled && d.r !== null) placePiece(d.idx, d.r, d.c);
  }

  document.addEventListener('pointermove', moveDrag);
  document.addEventListener('pointerup', ()=>endDrag(false));
  document.addEventListener('pointercancel', ()=>endDrag(true));

  function canPlace(shape, r, c){
    for(const [dr,dc] of shape){
      const rr=r+dr, cc=c+dc;
      if(rr<0||rr>=SIZE||cc<0||cc>=SIZE||grid[rr][cc]) return false;
    }
    return true;
  }

  function anyPlacementExists(piece){
    for(let r=0;r<SIZE;r++) for(let c=0;c<SIZE;c++) if(canPlace(piece.shape,r,c)) return true;
    return false;
  }

  function placePiece(idx, r, c){
    if(gameOver) return;
    const piece = tray[idx];
    if(!piece || !canPlace(piece.shape, r, c)) return;
    for(const [dr,dc] of piece.shape){
      grid[r+dr][c+dc] = piece.color;
    }
    score += piece.shape.length;
    tray[idx] = null;
    buzz(15);
    const cleared = clearLines();
    if(cleared>0) buzz([30,40,30]);
    if(tray.every(p=>p===null)) tray = newTray();
    hintEl.textContent = 'Parçayı sürükleyip tahtaya bırak';
    renderAll();
    checkGameOver();
  }

  function clearLines(){
    const fullRows = [], fullCols = [];
    for(let r=0;r<SIZE;r++) if(grid[r].every(v=>v)) fullRows.push(r);
    for(let c=0;c<SIZE;c++) if(grid.every(row=>row[c])) fullCols.push(c);
    const total = fullRows.length + fullCols.length;
    fullRows.forEach(r=>{ for(let c=0;c<SIZE;c++) grid[r][c]=null; });
    fullCols.forEach(c=>{ for(let r=0;r<SIZE;r++) grid[r][c]=null; });
    if(total>0) score += total*10 + Math.max(0,total-1)*10;
    if(score>best){ best=score; bestEl.textContent=best; saveBest(best); }
    return total;
  }

  function checkGameOver(){
    const active = tray.filter(p=>p);
    const stuck = active.length>0 && active.every(p=>!anyPlacementExists(p));
    if(stuck) endGame('Yer kalmadı!');
  }

  function endGame(reason){
    if(gameOver) return;
    gameOver = true;
    clearInterval(timerId);
    document.getElementById('finalReason').textContent = reason;
    document.getElementById('finalScoreText').textContent = `Skor: ${score}`;
    overlay.classList.add('show');
  }

  document.getElementById('newgame').addEventListener('click', initGame);
  document.getElementById('restartBtn').addEventListener('click', initGame);

  const qrToggle = document.getElementById('qrToggle');
  const qrbox = document.getElementById('qrbox');
  let qrRendered = false;
  qrToggle.addEventListener('click', ()=>{
    qrbox.classList.toggle('open');
    if(qrbox.classList.contains('open') && !qrRendered){
      try{
        new QRCode(document.getElementById('qrcanvas'), {
          text: window.location.href,
          width:150, height:150,
          colorDark:"#141225", colorLight:"#ffffff"
        });
        qrRendered = true;
      }catch(e){}
    }
  });

  initGame();
})();
</script>
</body>
</html>
